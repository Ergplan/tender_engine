- field_path: core.commercial.change_in_law_clause
  section: commercial
  value_type: long_text
  required: false
  decision: approved
  final_value: 'GCC Clause 51.1: if after the date seven (7) days prior to bid submission any law, regulation, ordinance,
    order or by-law in the country of the Site is enacted, changed or repealed (including changes in interpretation and any
    change in rates of Taxes, duties and cess or any new tax applicable for setting up the project) that affects the Contractor''s
    costs and/or Time for Completion, the Contract Price is correspondingly increased or decreased and/or the Time for Completion
    reasonably adjusted; the Contractor must forward supporting documents within 15 days of the enactment. Adjustments are
    restricted to direct transactions between the PMC and Contractor and bought-out items dispatched directly from sub-vendor''s
    works to Site, are not paid separately if already covered by price adjustment provisions, and any tax increase beyond
    the contractual completion period is to the Contractor''s account while decreases pass to the Owner. Change in Law excludes
    changes in corporate income tax, withholding tax on income or dividends, and regulatory measures by the Appropriate Commission.'
