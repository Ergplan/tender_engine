- field_path: core.commercial.termination_compensation
  section: commercial
  value_type: long_text
  required: false
  decision: approved
  final_value: 'Termination for Owner''s convenience (GCC 25.1): the Owner pays the Contract Price attributable to supplies
    executed up to termination, reasonable costs of removing equipment and repatriating personnel, amounts payable to sub-contractors
    including cancellation charges, and costs of protecting the supplies and leaving the site clean and safe. Termination
    for Contractor''s default (GCC 25.2): the Contractor is paid the Contract Price attributable to supplies executed, the
    value of unused Plant on site and protection costs, less sums due to the Owner; if that sum plus the Owner''s cost of
    completing exceeds the Contract Price, the Contractor is liable for the excess. Under GCC 22.2 the Contract Performance
    Security is liable to forfeiture and the Owner may recover excess cost; under GCC 20.2 risk-and-cost execution may be
    recovered irrespective of the LD cap.'
  version_no: 1
