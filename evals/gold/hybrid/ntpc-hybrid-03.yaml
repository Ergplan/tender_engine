- field_path: core.summary.plain_english_summary
  section: summary
  value_type: long_text
  required: true
  decision: approved
  final_value: 'What is procured: NTPC is procuring 1200 MW of wind-solar hybrid power from ISTS-connected projects anywhere
    in India, with a greenshoe option of additional capacity of up to 600 MW. [1][2][3][4][5] Projects are on a Build-Own-Operate
    basis, with or without an energy storage system, and each resource must make up at least 33 percent of the project with
    a combined CUF floor of 30 percent. [6][7][8][9][10] Bids must be at least 50 MW and no more than 600 MW. [11][12][13][14]


    Buyer and offtaker: NTPC Limited issues the tender and signs the Power Purchase Agreement as intermediary procurer, selling
    the power under back-to-back Power Sale Agreements to End Procurers or Buying Entities (DISCOMs) who assume all of NTPC''s
    obligations under the PPA. [15][16][17][18][19][20][21] The specific End Procurers are not named. [22]


    Location: Projects may be located anywhere in India, connected to the ISTS, on land that the generator identifies and
    arranges itself. [23][24][25][26] The delivery point is the ISTS substation at which the project is interconnected, and
    metering is at the low voltage side of the CTU/STU substation where power is injected. [27][28][29] The solar and wind
    parts of a project may be at the same or different sites. [30]


    Timeline: The tender was issued on 30 October 2024, the pre-bid meeting and last date for queries were on 18 November
    2024, and bids were due and technical bids opened on 2 December 2024; the financial bid opening and reverse auction dates
    are to be intimated later by NTPC. [31][32][33][34][35][36][37][38][39] Bids remain valid for 180 days. [40] Financial
    closure is due 6 months before the scheduled commissioning date, commissioning is due 24 months from the effective date,
    and the PPA runs for 25 years. [41][42][43][44]


    Eligibility: No prior project experience is required; the only technical criterion is that the bidder deploy commercially
    established technologies, with wind turbines from the MNRE RLMM list and solar modules from ALMM List-I. [45][46] Financially,
    bidders need a net worth of INR 11460000 (INR 1.146 crore) per MW, turnover of INR 6154000 (INR 61.54 lakh) per MW and
    liquidity of INR 1230800 (INR 12.31 lakh) per MW. [47][48][49][50] Consortia may bid and parent or affiliate credentials
    may be used, but the successful bidder''s shareholding in the project company must not fall below 51% until one year after
    the scheduled commencement of supply date without NTPC''s approval. [51][52][53][54]


    Money at risk: The EMD is INR 1160000 (INR 11.6 lakh) per MW of capacity bid and must be valid for 10 months, alongside
    a bid processing fee of INR 300000 (INR 3 lakh) and success charges of INR 100000 (INR 1 lakh) per MW. [55][56][57][58][59][60][61][40]
    A performance bank guarantee of INR 2900000 (INR 29 lakh) per MW of awarded contracted capacity is submitted for each
    project before PPA signing, initially valid for 7 months beyond the SCSD, and a POI from IREDA/PFC/REC may be given in
    its place. [62][63][64][65][66] The PBG is encashed proportionately per day for delay in commencement of supply up to
    6 months beyond the SCSD, and may be encashed for failure to achieve financial closure, failure to execute the PPA in
    time, PPA signing delayed beyond 30 days for reasons attributable to the bidder, Integrity Pact breaches or misrepresentation;
    unsuccessful bidders'' EMD is released within fifteen days of the reverse auction and the PBG is returned within 45 days
    of the SCSD. [67][68][69][70][71][72][73][74][75][76]


    Tariff or payment: The tariff is fixed and discovered through an e-reverse auction, under a 25-year PPA. [77][78][44][79]
    The generator pays PSM charges of Rs. 0.02/kWh to NTPC as a discount in the monthly tariff payment; the size of any letter
    of credit or payment security fund is not stated. [80] Energy above the maximum CUF (120% of declared CUF) may be sold
    to other entities subject to the Procurer''s first right of refusal, and is bought at the PPA tariff if the Procurer takes
    it. [81][82][83]


    Obligations and penalties: The generator must arrange land, obtain all clearances, build and pay for the dedicated transmission
    line up to the interconnection point and secure connectivity, with the ISTS waiver cut-off on 30 June 2028; GNA responsibility
    is placed on the Buying Entities in some clauses but listed among the generator''s responsibilities in another. [84][85][86][87][88][89][90][91][23][25][92]
    If supply falls below the minimum CUF (90% of the declared annual CUF), the generator pays a penalty of one and a half
    times the PPA tariff on the shortfall in energy, relaxable to the extent of grid non-availability beyond its control.
    [93][94] Delay in commencement of supply is penalised by per-day PBG encashment for up to 6 months beyond the SCSD, and
    delay beyond 6 months leads to termination. [95][72][73][74][75][76][96][97]'
