- field_path: core.penalties.pbg_encashment_triggers
  section: penalties
  value_type: long_text
  required: false
  decision: approved
  final_value: '(1) Delay in commencement of power supply beyond SCSD up to 6 months: PBG/POI encashed on a per-day basis
    proportionate to the Contracted Capacity not commenced (e.g. PBG x (100/240) x (18/180)). (2) Default in achieving Financial
    Closure (6 months before SCSD) within the stipulated time, or failure to furnish documents or pay the Rs. 100/MW/day +
    GST extension charge within the 7-day notice: NTPC may encash PBG/POI and remove the Project / terminate the PPA. (3)
    Failure to submit requisite documents, meet eligibility or execute the PPA within the stipulated time: BG equivalent to
    the EMD encashed from EMD or PBG as liquidated damages. (4) PPA signing delayed beyond 30 days for reasons attributable
    to the HPG: NTPC may cancel LoA and encash EMD/PBG. (5) Integrity Pact transgression leading to disqualification or termination
    of LOA/PPA: forfeiture of EMD and encashment of PBG. (6) Concealment/misrepresentation in bid: Bank Guarantee provided
    up to that stage encashed.'
