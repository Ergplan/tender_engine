- field_path: core.commercial.termination_compensation
  section: commercial
  value_type: long_text
  required: false
  decision: approved
  final_value: On termination for Supplier Default, the Supplier pays the Procurer a Termination Payment equal to 100% of
    the Tariff that would have been due and payable for the Minimum Supply Obligation for 24 months as if the Supply Capacity
    were supplied for 24 months from the date of Termination, in addition to other payments due on default. On termination
    for Procurer Default, the Procurer pays the Supplier the same amount (100% of Tariff for Minimum Supply Obligation for
    24 months). Termination Payment is due within 15 days of demand; delay bears interest at 3% above the Bank Rate, delay
    not to exceed 90 days, and it is a full and final settlement of all claims. On termination for Force Majeure (natural
    or non-natural, after 365 days), the Supplier is eligible only for undisputed payments under outstanding Monthly Invoices
    before the Force Majeure Event. Article 18 compensation for breach is Omitted.
