- field_path: core.penalties.shortfall_penalty_basis
  section: penalties
  value_type: long_text
  required: false
  decision: approved
  final_value: 'If the Supplier fails to supply the Supply Capacity in accordance with Clause 5.1.2 (minimum 80% CUF annually,
    minimum 70% CUF monthly, minimum 90% CUF during 4 daily Peak Hours, and minimum 51% from Traceable Green Power), save
    in Force Majeure, Liquidated Damages are payable equal to the higher of four amounts computed cumulatively on an annual
    basis: (i) 100% of the Applicable LD Tariff on units short of 70% monthly CUF; (ii) 100% of the Applicable LD Tariff on
    units short of 80% annual CUF; (iii) 100% of the Applicable LD Tariff on units short of 90% CUF on monthly basis for Peak
    Hours (4 Hours Daily); (iv) 400% of the Applicable LD Tariff on the shortfall against minimum 51% annual supply from Traceable
    Green Power. The Applicable LD Tariff is the Applicable Tariff for (iv) and the Fixed Charge (70% of the Applicable Tariff)
    for the other cases. Power the Procurer does not buy/despatch (Clauses 10.2 and 11.4.3) is not counted as shortfall. Damages
    may be deducted from Tariff payable (Clause 11.9.5).'
  version_no: 1
  evidence_pages:
