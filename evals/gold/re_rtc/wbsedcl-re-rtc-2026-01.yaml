- field_path: core.commercial.payment_security_mechanism
  section: commercial
  value_type: long_text
  required: false
  decision: approved
  final_value: Procurer must, at least 30 days before the SSD of each Phase, provide an unconditional, weekly revolving and
    irrevocable letter of credit (from any nationalized bank, costs borne by Procurer) for the Minimum Monthly Payment, defined
    as 30% of the 3 months Tariff payable against the Supply Capacity computed on the Minimum Supply Obligation on annual
    basis, revised yearly. If the LC cannot be opened the Distribution Company may pay in advance an amount equal to the weekly
    bill (estimated or previous 6 months' average); the alternate payment security mechanism of the MoP order dated 17.07.2019
    also applies. Default escrow account is omitted; on termination 35% of 3 months Tariff (Maximum Monthly Payment) is appropriated
