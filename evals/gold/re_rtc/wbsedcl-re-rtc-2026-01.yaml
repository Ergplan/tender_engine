- field_path: core.commercial.change_in_law_clause
  section: commercial
  value_type: long_text
  required: false
  decision: approved
  final_value: 'Change in Law means, after the Bid Date, the enactment, amendment, modification or repeal of any Applicable
    Law, commencement of a law not yet in effect at Bid Date, a final binding change in judicial interpretation, any change
    in Tax rates with direct effect on the Project or supply of power, or a change in Applicable Permits (other than for Supplier
    default) that changes cost; changes in withholding tax on income or dividends are excluded. Where the aggregate financial
    effect exceeds 0.1% of 100% of Tariff payable in any Accounting Year, the monthly tariff is adjusted under the Electricity
    (Timely Recovery of Costs due to Change in Law) Rules, 2021 to restore the affected party to the same economic position:
    21 days'' prior notice, computation furnished within 30 days of the event or expiry of the notice (whichever is later),
    recovery from the next billing cycle as one-time, monthly or per-unit charges in the Monthly Invoice. Non-recurring impacts
    are converted to a monthly tariff modification MT = Y/X (annuity over up to 180 months at the CERC loan interest rate,
    or SBI MCLR + 200 bps), trued up annually, rounded to three decimals; the Appropriate Commission verifies and adjusts
    within 60 days of receiving documents filed within 30 days.'
