- field_path: core.penalties.shortfall_penalty_basis
  section: penalties
  value_type: long_text
  required: false
  decision: approved
  final_value: BESSD guarantees minimum monthly system availability of 85%. Shortfall attracts liquidated damages of twice
    the PPA Tariff for the discharge energy not made available during the month, computed as LD = (A – B) x C x 1000 x D x
    n x 2 (A guaranteed availability %, B actual availability %, C BESS capacity in MWh, D tariff INR/kWh, n days in month);
    not applicable in Force Majeure. If the BESS fails to meet 50% of the stipulated availability for a cumulative period
    of 2 years or more, it is an Event of Default and failure to rectify leads to PPA termination.
