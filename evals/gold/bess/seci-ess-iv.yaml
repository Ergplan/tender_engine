- field_path: sector.power.common.deemed_generation_clause
  section: commercial
  value_type: long_text
  required: false
  decision: approved
  final_value: The Buying Entity assures 100% offtake of the total energy corresponding to the declared capacity except in
    circumstances of grid unavailability or Force Majeure (no compensation stated for those). If the Buying Entity is unable
    to offtake for other reasons, it remains liable to pay 100% of the applicable tariff on the total energy corresponding
    to the declared capacity, provided the BESSD offers the un-requisitioned power at the power exchange (price taker) or
    to a third party; revenue from such sale after applicable expenditure is first adjusted against the payment due from the
    Buying Entity, and any gain thereafter is shared 50:50 between Buying Entity and BESSD, settled quarterly. If the BESSD
    delivers less than requisitioned, only the actual energy discharged is paid.
  version_no: 1
  evidence_pages:
