  section: penalties
  value_type: long_text
  required: false
  decision: approved
  final_value: '(1) Delay in commissioning beyond SCD up to 6 months: total PBG/POI encashed pro-rata, proportionate to balance
    capacity not commissioned (BESSD may instead pay LD directly; if no response within 7 days or non-payment within 2 business
    days, PBG encashed). (2) Delay beyond 6 months from SCD: entire PBG/POI encashed, PPA capacity reduced and PPA terminated
    for un-commissioned capacity. (3) Default in achieving Financial Closure within stipulated time (4 months prior to SCD):
    PBG/POI encashed and Project removed; after 7 business-day notice without documents or Rs. 1,000/MW/day extension charge,
    PBG/POI/Surety Bond encashed and PPA terminated. (4) Failure to submit documents, meet eligibility or sign PPA within
    stipulated time: BG equivalent to EMD amount encashed from EMD or PBG.'
