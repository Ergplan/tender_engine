- field_path: sector.power.bess.availability_penalty
  section: bess_performance
  value_type: long_text
  required: false
  decision: approved
  final_value: 'Liquidated damages equal to twice the PPA tariff for discharge energy not made available during the month,
    settled monthly: LD = (A – B) x C x 1000 x D x n x 2, where A is guaranteed monthly availability (85%), B actual monthly
    availability, C BESS capacity in MWh, D tariff in INR/kWh, n days in month. Failure to meet 50% of stipulated availability
    for a cumulative 2 years or more is an Event of Default leading to PPA termination. LD paid to SECI for remittance to
    Buying Entity; not applicable during Force Majeure.'
