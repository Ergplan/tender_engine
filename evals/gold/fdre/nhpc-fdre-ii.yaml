- field_path: core.penalties.pbg_encashment_triggers
  section: penalties
  value_type: long_text
  required: false
  decision: approved
  final_value: '(1) Failure of the selected bidder to submit the requisite documents, meet eligibility criteria or execute
    the PPA within the stipulated time: an amount equal to the EMD is encashed from the EMD or PBG as liquidated damages.
    (2) Delay in commencement of supply beyond SCSD (up to 6 months from SCSD/extended SCSD): the PBG/POI/Insurance Surety
    Bond is encashed on a per-day basis proportionate to the capacity not commissioned (e.g. PBG amount x (160/800) x (45/180),
    month = 30 days), applicable even where 0 MW is commissioned. (3) In addition to other remedies, the PBG/POI can be encashed
    to recover any damages/dues of the generator under the PPA; recovered amounts are credited to the Payment Security Fund.
    (4) On RPD/RE-PG Event of Default (failure to maintain minimum CUF/availability, assignment/novation contrary to PPA,
    repudiation, other uncured breaches), damages equal to 24 months of tariff may be recovered by forfeiture of the bank
    guarantee/POI. Failure to furnish and maintain the PBG is itself a material breach. PBG is returned after commissioning
    (within 45 days of SCSD under the PPA) after adjusting delay damages.'
