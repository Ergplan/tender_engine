- field_path: core.commercial.payment_security_mechanism
  section: commercial
  value_type: long_text
  required: false
  decision: approved
  final_value: Under the draft PPA (Art. 10.4) NHPC provides the developer a monthly unconditional, revolving and irrevocable
    letter of credit, sized at the estimated average monthly billing for the first Contract Year and the average monthly billing
    of the previous Contract Year thereafter, with a 12-month term renewed annually; the developer may draw on it only after
    thirty days from the Due Date of an unpaid bill, and NHPC must restore any shortfall within 7 days. NHPC also maintains
    a Payment Security Fund, for which the developer pays PSM charges of 2 paisa per unit (Rs. 0.02/kWh) as a discount on
    monthly tariff payments (RfS 3.13, PPA 10.4.9). Back-to-back, the PSA requires the Discom to give NHPC an LC revised annually
    for 105% of average monthly billing (due date 45 days from bill presentation) and the Discom may provide a Payment Security
    Fund supporting at least 3 months' billing; no state guarantee is mentioned.
