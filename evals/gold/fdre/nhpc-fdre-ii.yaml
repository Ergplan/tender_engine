- field_path: core.penalties.shortfall_penalty_basis
  section: penalties
  value_type: long_text
  required: false
  decision: approved
  final_value: 'Two shortfall rules apply, and both damages may be levied in the same Contract Year. (a) Shortfall in 90%
    availability of contracted capacity during Peak Hours, calculated monthly, for reasons attributable to the RPD/RE-PG:
    penalty applied to the shortfall in generation corresponding to the availability shortfall. (b) Failure in any Contract
    Year to supply minimum energy corresponding to the annual CUF within the permissible lower limit of the declared CUF (annual
    CUF to be maintained within (+)10% / (-)15% of declared value; illustration uses 85% of declared CUF). Penalty for both
    is equal to one and a half times the tariff for the number of units not supplied (illustrated in Annexure-1A / Schedule
    4). Not applicable for Force Majeure or grid non-availability beyond the RPD''s control, nor for the part Contract Year
    immediately after CSD. Continued failure to maintain minimum CUF / minimum availability is an Event of Default: the PPA
    is liable to be terminated and the RPD/RE-PG must pay damages equal to 24 months (or balance PPA period if less) of tariff
    for the contracted capacity, recoverable by forfeiture of the bank guarantee/POI.'
  version_no: 1
  evidence_pages:
