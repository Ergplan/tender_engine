  decision: approved
  final_value: General Network Access (GNA) is to be obtained by the Buying Entity prior to commissioning/commencement of
    supply; the Buying Entity bears all transmission charges and losses beyond the Delivery Point up to the drawl point. The
    REPD must follow the Detailed Procedure under the CERC (Connectivity and GNA to ISTS) Regulations, 2022 and obtain connectivity;
