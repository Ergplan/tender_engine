  decision: approved
  final_value: 'What is procured: NHPC Limited is procuring 1200 MW of ''Firm & Dispatchable'' renewable power from ISTS-connected
    RE power projects coupled with energy storage systems, on an anywhere-in-India basis under tariff based competitive bidding
    (Tranche-II, Open Category), with selection through an e-reverse auction. [1][2][3][4][5][6][7] Each bidder may offer
    a minimum of 50 MW and a maximum of 600 MW. [8][9][10][11] Storage is mandatory: the developer must combine RE generation
    with ESS to supply the contracted capacity at a minimum 90% availability during peak hours and at a declared annual CUF
    of not less than 40%. [12][13][14][15][16][17]


    Buyer and offtaker: NHPC Limited issues the RfS and signs the Power Purchase Agreement with the selected bidders. [18][19][20]
    NHPC acts as Intermediary Procurer and trading licensee under the PPA, selling the power back-to-back under Power Sale
    Agreements to the Buying Entities (Discoms), who are the end procurers. [21][22] The Buying Entities will be named later.
    [23]


    Location: Projects may be set up anywhere in India, connected to the ISTS, on land identified and arranged by the developer,
    who must show possession of 100% of the land in its name for the full PPA term on or before the Scheduled Commencement
    of Supply Date. [24][25][26][27][28] The delivery point is the point at 220 kV or above at the CTU substation where the
    power from the project is injected into the ISTS; metering is on the low voltage side of the CTU/STU substation or, for
    RE parks, at the pooling station. [29][30][31] The developer builds and pays for the dedicated transmission line up to
    the Interconnection Point with no reimbursement, and the proposed location may be changed only up to Financial Closure.
    [32][33][34][35][36]


    Timeline: The RfS was issued on 15 March 2024, queries were due by 26 March 2024, the pre-bid meeting was on 28 March
    2024, bids were due by 12 April 2024 and technical bids were to be opened on 17 April 2024. [37][38][39][40][41][42][43]
    Bids are valid for 180 days; the e-reverse auction and price bid opening dates are not printed and are to be intimated
    separately by NHPC. [44][45][46][47] The PPA is to be signed within a 90-day window, financial closure is due 18 months
    from the effective date and scheduled commissioning is 24 months from the effective date. [48][49][50][51]


    Eligibility: No prior project experience or commissioned capacity is required; the bidder need only deploy commercially
    established and operational solar PV, wind and ESS technologies. [52][53] Financially, the bidder must show net worth
    of INR 1.3 crore per MW, annual turnover of INR 63.8 lakh per MW and liquidity of INR 12.76 lakh per MW. [54][55][56][57]
    Consortia may bid and parent or affiliate credentials may be used, but controlling shareholding may not change from RfS
    submission until PPA execution, and the successful bidder (or consortium members combined) must hold at least 51% of the
    project company until one year after the SCSD. [58][59][60][61][62][63][64]


    Money at risk: Bidders pay a bid processing fee of INR 3 lakh and furnish an Earnest Money Deposit of INR 9,28,000 per
    MW of solar, INR 12,64,000 per MW of wind and INR 14,64,000 per MW of ESS, subject to a maximum of Rs. 10 crore per project,
    valid for 12 months. [65][66][67][68][69][70][71] Before signing the PPA, selected bidders submit a Performance Bank Guarantee
    of INR 23,20,000 per MW of solar, INR 31,60,000 per MW of wind and INR 36,60,000 per MW of ESS, valid until 9 months after
    the Scheduled Commissioning Date, after which the EMD is returned. [72][73][74][75] An amount equal to the EMD is forfeited
    if the selected bidder fails to submit documents, meet eligibility or sign the PPA in time; the PBG is encashed per day
    in proportion to capacity not commissioned for delay beyond the SCSD, and is fully encashed with termination of the PPA
    for the un-commissioned capacity if delay exceeds SCSD plus 6 months. [76][77][78][79][80][81][82][83][84]


    Tariff or payment: The successful bidder is paid a fixed tariff, bid in Rs/kWh and finalised through the e-reverse auction,
    under a PPA with a tenure of 25 years. [2][3][85][86][87][88][89][90][91][92][93] NHPC provides a monthly unconditional,
    revolving and irrevocable letter of credit sized at estimated average monthly billing, and the developer pays Payment
    Security Mechanism charges of 2 paisa per unit as a discount on monthly tariff payments. [94][95][96][97][98][99] Late
    payments carry a surcharge at SBI one-year MCLR plus 5% for the first month, rising 0.5% each further month and capped
    at 3% above the base rate, payable by NHPC subject to receipt from the Discom. [100][101][102]


    Obligations and penalties: The developer must supply the contracted capacity with at least 90% availability during four
    daily peak hours (2 hours within 05:00-10:00 and 2 hours within 18:00-23:00, as scheduled by the Buying Entity), assessed
    monthly, and keep annual CUF within +10% / -15% of its declared value, with 100% of annual energy from RE. [12][13][14][15][103][16]
    Shortfall in peak-hour availability or in annual minimum energy is penalised at 1.5 times the tariff for the units not
    supplied, both may be levied in the same Contract Year, and continued failure is an Event of Default allowing termination
    and damages equal to 24 months of tariff for the contracted capacity. [104][105][106][107][108][109] Commissioning may
    be delayed up to 6 months beyond the SCSD with per-day encashment of the PBG, and delay beyond 6 months leads to termination;
    the developer also bears connectivity, land and all clearances and must use ALMM-listed equipment. [110][111][80][81][82][83][84][112][113][114][115][116][117][118][119][120]'
