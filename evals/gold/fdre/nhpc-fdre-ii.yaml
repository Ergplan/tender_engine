- field_path: core.commercial.change_in_law_clause
  section: commercial
  value_type: long_text
  required: false
  decision: approved
  final_value: 'Change in Law (PPA Art. 12.1.1) covers the enactment, amendment, modification or repeal of any Indian Law,
    a change in its interpretation or application by a Governmental Instrumentality or court, imposition of new consents/clearances/permits
    or new conditions for them, and any statutory change in tax structure or new tax applicable to setting up the project
    and supply of power after the bid submission date (bid date is the reference date for tax changes); it excludes changes
    in corporate income tax or withholding tax and regulatory measures by the Appropriate Commission. Relief (Art. 12.2) places
    the affected party (developer or Buying Entity) in the same financial position, with compensation determined under the
    Electricity (Timely Recovery of Costs due to Change in Law) Rules, 2021: 21 days'' prior notice, computation furnished
    within 30 days, recovery through monthly tariff adjustment MT=(Y/X) as an annuity over a maximum of 180 months for non-recurring
    impacts (or until the impact persists for recurring ones), trued up annually, rounded to three decimals, and verified
    by the Appropriate Commission within sixty days.'
