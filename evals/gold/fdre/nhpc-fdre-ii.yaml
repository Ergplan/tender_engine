  final_value: No change in controlling shareholding from RfS submission until PPA execution (not applicable to listed companies).
    A single-company successful bidder must keep at least 51% shareholding in the SPV/project company until 1 year after SCSD;
    for a consortium the combined members' shareholding must not fall below 51% until 1 year from COD, and the Lead Member's
    controlling shareholding (>50% voting rights) must not change from RfS application date till 1 year after SCSD. Promoters
