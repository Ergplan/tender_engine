- field_path: core.commercial.termination_compensation
  section: commercial
  value_type: long_text
  required: false
  decision: approved
  final_value: On termination of the PPA for NHPC/Buying Entity default (after the consultation period and failed novation),
    NHPC/Buying Entities pay the developer damages equivalent to 24 months, or the balance PPA period if less, of charges
    for its contracted capacity at the stipulated minimum CUF/Availability, subject to NHPC receiving the amount from the
    Buying Entity/Discom; STU/CTU connectivity damages are borne by the Discom. If the PSA is terminated or reduced, any termination
    compensation paid by the Buying Entity is passed on to the developer after deducting NHPC's costs. For developer default
    by delay beyond SCSD + 6 months, a Generator Event of Default occurs, the PBG is encashed and the PPA for the un-commissioned
    capacity is terminated; no Termination Compensation is payable on termination for a Natural Force Majeure event beyond
