- field_path: sector.power.fdre.firmness_definition
  section: fdre_profile
  value_type: long_text
  required: false
  decision: approved
  final_value: '''Firm and Dispatchable RE Power'' means the power profile configuration defined in the RfS to be met by RE
    power sources: supply of contracted capacity from ISTS-connected RE projects (solar, wind or other MNRE-defined renewable)
