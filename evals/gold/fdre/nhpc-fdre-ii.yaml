  section: fdre_profile
  value_type: long_text
  required: true
  decision: approved
  final_value: After SCSD, shortfall in 90% peak-hour availability (calculated monthly) for reasons attributable to the RPD
    makes it liable to pay the penalty provided in the PSA (payable by NHPC to Buying Entities), applied to the shortfall
    in generation corresponding to the availability shortfall. Penalty for not meeting stipulated availability and supply
    of energy (including annual CUF shortfall below the permissible lower limit) is 1.5 times the tariff for the number of
