- field_path: sector.power.common.deemed_generation_clause
  section: commercial
  value_type: long_text
  required: false
  decision: approved
  final_value: Under PPA Article 4.9, for grid unavailability beyond 175 hours in a year and for reduced offtake/backdown
    beyond 175 hours in a year, the buying entity/Discom pays Generation Compensation = (Tariff x RE power (MW) offered but
    not scheduled by Procurer) x 1000 x number of hours, at the PPA tariff (Article 9, excluding trading margin). The developer
    must sell the unscheduled power on the power exchange as price taker, and 95% of the amount realised after deducting expenses
    is adjusted against the compensation monthly; compensation is limited to the difference between actual generation up to
    declared/contracted capacity and the quantum scheduled, is paid with the energy bill of the month after receipt of REA,
    and carries no trading margin. The PSA (Art. 2.5) mirrors this and excludes compensation for backdown on grid security,
    safety or Force Majeure grounds.
