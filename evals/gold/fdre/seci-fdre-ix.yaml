- field_path: sector.power.common.deemed_generation_clause
  section: commercial
  value_type: long_text
  required: false
  decision: approved
  final_value: For grid unavailability (temporary transmission unavailability not attributable to the RPD) beyond 175 hours
    in a Contract Year, the Buying Entity pays Generation Compensation = Applicable Tariff x RE Power (MW) offered but not
    scheduled x 1000 x hours of grid unavailability, paid annually, with no claim against SECI. For reduced off-take by the
    Buying Entity (including non-dispatch under the LPS Rules 2022) beyond 175 hours in a Contract Year, the same formula
    applies using hours of reduced off-take, paid via the energy bill of the successive month with no trading margin. In both
    cases the RPD must sell the unscheduled power on the power exchange as a price taker and 95% of the amount realised, after
    expenses, is adjusted monthly against the compensation; no compensation for backdown due to grid security, equipment/personnel
