- field_path: core.commercial.change_in_law_clause
  section: commercial
  value_type: long_text
  required: false
  decision: approved
  final_value: Change in Law means events pertaining to the Project occurring after the date 7 days prior to the bid submission
    deadline, including enactment/amendment/repeal of law leading to cost changes requiring a tariff change, a change in interpretation
    of law by a competent court, a change in any domestic tax, duty, levy, cess, charge or surcharge, or a change in conditions
    of an approval or licence; it excludes changes in withholding tax on income/dividends, changes in deviation settlement
    charges or frequency intervals, and events after SCSD that would not have affected a project commissioned before SCSD.
    On occurrence, the monthly tariff or charges are adjusted and recovered under the Electricity (Timely Recovery of Costs
    due to Change in Law) Rules, 2021 to restore the affected party to the same economic position, after 21 days' prior notice,
    with computation furnished within 30 days and recovery from the next billing cycle; non-recurring impacts are converted
    to a monthly tariff adjustment MT = Y/X using an annuity formula over up to 180 months at the CERC loan interest rate
    (or SBI MCLR + 200 bps).
