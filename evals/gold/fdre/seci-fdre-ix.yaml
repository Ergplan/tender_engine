- field_path: sector.power.fdre.availability_shortfall_penalty
  section: fdre_profile
  value_type: long_text
  required: true
  decision: approved
  final_value: For any shortfall in Peak Hours supply below the mandated energy (up to 400 MWh per 100 MW per day), the RPD
    pays a penalty of 1.5 x PPA Tariff per unit of shortfall, computed on a billing-month basis against the sum of Peak Hours
    of the month (1 MWh per MW per Peak Hour). Shortfall up to 10% of the monthly Peak Hours requirement is permissible; penalty
    is levied on the average monthly shortfall beyond 10% (illustration in Annexure F). Additionally, third-party sale while
    PPA commitments are unmet attracts a penalty of 1.5 times the extant market rate/kWh (highest of DAM/G-DAM/RTM), over
    and above the shortfall penalty.
  version_no: 1
