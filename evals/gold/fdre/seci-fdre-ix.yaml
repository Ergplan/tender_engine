- field_path: sector.power.common.gna_requirement
  section: connectivity_and_compliance
  value_type: long_text
  required: false
  decision: approved
  final_value: The RPD must follow the Detailed Procedure issued by CERC/CTU under the CERC (Connectivity and General Network
    Access to the ISTS) Regulations, 2022, and must have already applied for connectivity for non-solar hour access (in its
    own name or that of an entity whose connectivity it may use under GNA Regulations, with an Annexure-J undertaking) for
    at least the offered Contracted Capacity. Obtaining General Network Access (GNA) itself is the responsibility of the Buying
    Entity, which bears all transmission charges, losses and other charges beyond the Delivery Point up to the drawl point
