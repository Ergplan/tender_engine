- field_path: core.commercial.termination_compensation
  section: commercial
  value_type: long_text
  required: false
  decision: edited
  final_value: 'Article 13.4 (p. 67) partially describes compensation relating to termination arising from SECI''s Event of
    Default. The visible provision refers to monthly assured energy during Peak Hours but does not provide the complete compensation
    formula. Where SECI''s default is triggered by a Buying Entity''s default, SECI shall recover the specified amount from
    the Buying Entity.


    Where the PPA/PSA is terminated due to an Event of Default by SECI/Buying Entity, damages or charges payable to STU/CTU
    for plant connectivity shall be borne by SECI/Buying Entity.


    Under Article 13.5 (p. 67), termination due to prolonged Force Majeure is at SECI''s discretion, subject to Buying Entity
    consent, without further liability to either Party.


    The complete termination compensation provisions for defaults by both parties cannot be established from the available
    excerpts.'
  version_no: 1
  evidence_pages:
  - 67
  reviewer: venture@aayuda.energy
  decided_at: '2026-10-14T06:08:19.077448+00:00'
  note: null
  candidate:
    id: e8c7e1a1f5ce44618ee77725b170fb1b
    value: 'Only the tail of Article 13.4 is attached: on termination for SECI Event of Default, the compensation amount is
      linked to the monthly assured energy to be supplied during Peak Hours, and where SECI''s default is triggered by a Buying
      Entity default, SECI recovers the amount from the Buying Entity; any damages or charges payable to the STU/CTU for connectivity
      are borne by SECI/Buying Entity. On termination due to prolonged Force Majeure (Article 13.5), SECI may terminate at
      its discretion with Buying Entity consent and no liability arises for either Party. Compensation payable on RPD default
      is not on the attached pages.'
