- field_path: core.penalties.pbg_encashment_triggers
  section: penalties
  value_type: long_text
  required: false
  decision: approved
  final_value: '(1) Delay in commencement of supply beyond the SCSD/extended SCSD up to 6 months: total PBG encashed on pro-rata
    basis proportionate to the Contracted Capacity that has not commenced supply (Clause 9.2.c). (2) Delay beyond 6 months
    from SCSD: Contracted Capacity reduced to commissioned capacity, PPA for balance terminated and PBG corresponding to the
    un-commissioned capacity encashed pro-rata (Clause 9.2.d). (3) Default in achieving Financial Closure by 6 months prior
    to SCSD: SECI entitled to encash PBG/POI/Surety Bond and may remove the Project, unless extension charges of INR 100/MW/day
    + GST are paid; non-compliance after a 7-day notice leads to encashment and possible PPA termination (Clause 21.3). (4)
    Selected Bidder not submitting documents, not meeting eligibility or not executing PPA in time: BG equivalent to the EMD
    amount encashed from the EMD or PBG available with SECI (Clause 17.7).'
