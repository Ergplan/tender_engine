- field_path: core.penalties.shortfall_penalty_basis
  section: penalties
  value_type: long_text
  required: false
  decision: approved
  final_value: Shortfall in supply of power during Peak Hours against the mandated energy (4000 kWh per MW Contracted Capacity
    per day, i.e. up to 400 MWh per 100 MW) attracts a penalty on the energy shortfall calculated as 1.5 x PPA Tariff. Shortfall
    is calculated monthly (billing month) against the sum of Peak Hours of that month; shortfall is permissible up to 10%
    below the Buying Entity's energy requirement on a monthly basis and penalty is levied on the average monthly shortfall
    beyond 10% (illustration in Annexure-F). Separately, any third-party sale while PPA supply commitments remain unfulfilled
    attracts a penalty @1.5 times the extant market rate/kWh (highest of DAM/G-DAM/RTM rates that day) for the quantum sold,
    over and above the shortfall penalty.
