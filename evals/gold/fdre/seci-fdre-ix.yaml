  value_type: long_text
  required: false
  decision: approved
  final_value: SECI provides the RPD a monthly unconditional, revolving and irrevocable Letter of Credit through a scheduled
    bank, operative before the Due Date of the first Monthly Bill, with a 12-month term renewed annually, for 110% of the
    estimated average monthly billing in the first Contract Year and 110% of the average monthly billing of the previous Contract
    Year thereafter; the RPD may draw on it (max one drawal a month) if SECI fails to pay an undisputed bill by the Due Date,
    and SECI bears LC costs and restores shortfalls. In addition SECI may set up a payment security fund with a corpus from
    encashed PBG/POI and, where the RPD opts for it in lieu of PSM charges, a discount of Rs. 0.02/kWh in the monthly billing.
