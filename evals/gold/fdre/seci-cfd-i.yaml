- field_path: core.penalties.pbg_encashment_triggers
  section: penalties
  value_type: long_text
  required: false
  decision: approved
  final_value: '(1) Delay beyond the SCD up to and including 3 months after the SCD/extended SCD in commissioning the ESS
    component or in commencing supply of power/energy for the full Contracted Capacity: the total PBG/Surety Bond amount is
    encashed on a pro-rata basis proportionate to the higher of (i) the ESS capacity not commissioned or (ii) the Contracted
    Capacity that has not commenced supply (applies even where 0 MW has commenced supply). (2) Delay beyond 3 months after
    SCD: the PBG corresponding to the ESS capacity not commissioned or the capacity not commenced supply, whichever is higher,
    is encashed pro-rata and the CfDA for the balance capacity is terminated. (3) Delay in commissioning RE Generating component(s)
    beyond 36 months from the Effective Date of the CfDA: total PBG amount encashed pro-rata proportionate to the RE Generating
    component(s) not commissioned, recovered from the next monthly bill.'
