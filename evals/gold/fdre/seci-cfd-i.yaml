- field_path: sector.power.fdre.firmness_definition
  section: fdre_profile
  value_type: long_text
  required: false
  decision: approved
  final_value: 'The tender frames firmness as ''assured Peak Supply'': the RPD must supply 2 MWh per MW Contracted Capacity
    every day during self-chosen 2 Peak Hours (18:00-24:00, non-solar hours) through Power Exchanges, technology-agnostic,
    with or without ESS. 100% of annual energy scheduled must be RE power; up to 25% may be sourced from green market/bilateral
    agreements (ESS discharge counted, not charging energy). ESS charged from non-RE sources does not qualify as RE power.
    Third-party sale while the daily commitment is unfulfilled is a breach, penalised at 1.5 times (Reference Rate minus Strike
    Price).'
  version_no: 2
  evidence_pages:
