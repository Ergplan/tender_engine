  value_type: long_text
  required: true
  decision: approved
  final_value: 'What is procured: SECI is selecting RE power developers under a Contract for Difference (CfD) mechanism for
    assured peak supply of 1000 MWh (500 MW x 2 hours) from ISTS-connected RE projects in India, with a total capacity of
    500 MW to be selected through e-bidding followed by an e-Reverse Auction. [1][2][3][4][5][6][7] Bids are for between 50
    MW and 150 MW each. [8][9][10] Selection is technology agnostic, and the record marks storage as mandatory. [11][12][13]


    Buyer and offtaker: Solar Energy Corporation of India Limited (SECI) issues the RfS as Nodal Agency and will sign a Contract
    for Difference Agreement (CfDA) with the successful bidders. [14][15][16][17][18] There is no conventional offtaker: power
    is sold to market buyers on the Power Exchanges (GDAM/DAM/HPDAM/RTM), and SECI does not purchase the power but only carries
    out CfD settlement against the Strike Price. [19][20][21][22]


    Location: Projects can be located anywhere in India at locations chosen by the bidder at its own discretion, cost, risk
    and responsibility, with the developer identifying and arranging the land. [23][24][25] The delivery point is a single
    inter-connection point at 220 kV or above where power is injected into the identified ISTS substation, which is also the
    metering point (for pooled power, the ISTS substation). [26][27][28]


    Timeline: The RfS was issued on 19 April 2026, bids are due by 14 October 2026 and technical bids open on 19 October 2026;
    the notice page prints no query deadline or e-Reverse Auction date, which are expected in the RfS document. [29][30][31][32][33]
    Bids remain valid for 12 months, the Letter of Award follows at the end of the selection process, the CfDA is to be signed
    within 30 days, and financial closure is due 6 months before the scheduled commissioning date. [34][35][36][37][38][39]
    Scheduled commissioning is 15 months from the effective date, and the CfDA tenure is 12 years. [40][41][42][43]


    Eligibility: No prior project experience or commissioned-capacity requirement is stated; bidders need only deploy commercially
    established technologies, with wind turbines from the MNRE RLMM list and solar modules and cells from ALMM List-I/List-II.
    [44][45] Financially, bidders need a net worth of INR 9680000 (INR 96.8 lakh) per MW, an annual turnover of INR 4236900
    (INR 42.37 lakh) per MW and liquidity of INR 847380 (INR 8.474 lakh) per MW. [46][47][48][49][50][51] Consortiums may
    bid and parent or affiliate credentials may be used, but under-construction projects do not count; controlling shareholding
    may not change from bid submission until CfDA execution and promoters may not cede control until 1 year after SCD without
    SECI approval. [52][53][54][55][56][57][58]


    Money at risk: The EMD is INR 9,68,000 per MW of solar PV capacity plus INR 13,68,000 per MW of wind and other RE capacity
    plus INR 2,40,000 per MWh of ESS capacity, with no cap stated, valid for 12 months; a bid processing fee of INR 20,000
    and success charges of INR 100000 (INR 1 lakh) per MW also apply. [59][60][61][62][63] The PBG is INR 24,20,000 per MW
    of solar capacity plus INR 34,20,000 per MW of wind and other RE capacity plus INR 6,00,000 per MWh of ESS capacity, submitted
    within 20 days of the LoA and before signing the CfDA, valid until 6 months after the SCD, and returned within 45 days
    of successful commissioning after deducting delay penalties; unsuccessful bidders'' EMD may be released within 15 days
    after the e-Reverse Auction. [64][65][66][67][68][69][70][71][72][73] The PBG is encashed pro-rata for delay up to 3 months
    after the SCD in commissioning the ESS or commencing supply, delay beyond 3 months also terminates the CfDA for the balance
    capacity, and delay in commissioning the RE generating component beyond 36 months from the effective date triggers pro-rata
    encashment. [74][75][76]


    Tariff or payment: The successful bidder sells power on the Power Exchanges and SECI settles the difference against the
    Strike Price under a fixed tariff structure with a ceiling of INR 5.8 per kWh, for a CfDA tenure of 12 years. [19][20][77][78][79][80][43]
    SECI will maintain the CfD Pool for the complete term and replenish it from its own resources if its accrual becomes zero
    or negative; the amendment does not address a letter of credit, payment security fund or state guarantee. [81] Late payments
    by either party carry a surcharge at SBI one-year MCLR plus 5% for the first month, rising by 0.5% each month up to 3%
    above the base rate, and no Change in Law relief is admissible. [82][83][84]


    Obligations and penalties: The RPD must supply 2 MWh per MW of Contracted Capacity every day during any 2 self-chosen
    Peak Hours between 18:00 and 24:00 through the Power Exchanges, with 100% of annual scheduled energy being RE power (up
    to 25% sourceable from green market or bilateral sources) and a minimum weekly supply of 90% of the required energy. [85][86][87][88][89][90][91][92][93][94][95][96][97]
    Shortfall beyond 10% in a Contract Week against the mandated 14 MWh per MW is penalised at 1.5 times the difference between
    the highest non-solar-hour MCP across exchanges and the Strike Price on the shortfall energy, with no CfD settlement on
    the shortfall, uncleared volumes counting as shortfall, and third-party sale while commitments are unfulfilled penalised
    at 1.5 times (Reference Rate minus Strike Price) in addition. [98][97][99][100][101][102] Commissioning may be extended
    with penalty for up to 3 months, after which the CfDA for the balance capacity is terminated; no deemed generation compensation
    is stated, though energy curtailed due to transmission constraints is deducted from the weekly requirement. [103][104][105][106][107][108]'
