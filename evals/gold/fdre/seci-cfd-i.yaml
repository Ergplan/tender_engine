  section: fdre_profile
  value_type: long_text
  required: true
  decision: approved
  final_value: For shortfall in peak-hour supply in a Contract Week against the mandated 14 MWh per MW Contracted Capacity,
    the RPD pays a penalty at 1.5 times the difference between (i) the highest MCP in HPDAM/GDAM/DAM/RTM (or similar collective
    transaction market) across all Power Exchanges during non-solar hours between 18:00 and 24:00 across all days of the week
    and (ii) the Strike Price, applied to the shortfall energy. Penalty is levied only on shortfall beyond 10% in a Contract
    Week; no penalty if the market rate is below the Strike Price; RPD gets no CfD settlement for the shortfall; uncleared
    volume counts as shortfall; curtailed energy due to transmission constraints is deducted from the requirement. Accrued
    penalties are recovered monthly.
