- field_path: core.penalties.shortfall_penalty_basis
  section: penalties
  value_type: long_text
  required: false
  decision: approved
  final_value: 'Shortfall in energy supplied through Power Exchanges during Peak Hours in a Contract Week against the mandated
    14 MWh per 1 MW Contracted Capacity (i.e. 2 MWh per MW per day): penalty @ 1.5 times the difference between (i) the highest
    MCP in HPDAM/GDAM/DAM/RTM across all Power Exchanges during non-solar hours (18:00-24:00) across all days of the week
    and (ii) the Strike Price, corresponding to the shortfall energy. Penalty applies only on shortfall beyond 10% in a Contract
    Week (i.e. minimum supply 90% of required energy); no penalty if the reference MCP is below the Strike Price; RPD not
    eligible for CfD settlement on shortfall energy; uncleared volumes count as shortfall; curtailed energy due to transmission
    constraints is deducted from the requirement. Computed weekly, recovered monthly. Separately, third-party sale while supply
    commitments unfulfilled attracts penalty @1.5 times (Reference Rate - Strike Price) on the volume sold, over and above
    the shortfall penalty.'
  version_no: 2
  evidence_pages:
  - 22
  - 25
  reviewer: venture@aayuda.energy
  decided_at: '2026-10-13T10:21:12.977418+00:00'
