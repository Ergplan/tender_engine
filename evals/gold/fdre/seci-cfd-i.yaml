- field_path: sector.power.fdre.demand_profile
  section: fdre_profile
  value_type: long_text
  required: true
  decision: approved
  final_value: 'Amended supply condition (RfS Clause 9.1.d / CfDA Article 4.4.1.iv): the RPD shall supply power such that
    100% of the annual energy scheduled on the Power Exchange(s) corresponds to RE power. For the complete CfDA term the RPD
    may source up to 25% RE power (annual energy basis) from green market sources/bilateral agreements (25% of total annual
    energy to be supplied through the Exchanges, supplied directly during Peak Hours and/or used to charge the ESS; only ESS
    discharge counts). Additionally, for 36 months from the CfDA Effective Date, up to 75% RE power may be sourced from green
    market sources/bilateral agreements exclusively for charging the ESS for assured Peak supply during Peak Hours; thereafter
    up to an additional 50% RE power may be sourced from RE Projects owned by Group Companies of the RPD, exclusively for
    ESS charging. Excess supply over the 25% limit is not entitled to CfD settlement.'
  version_no: 4
  evidence_pages:
  - 1
  - 2
  reviewer: venture@aayuda.energy
  decided_at: '2026-10-13T10:24:43.153874+00:00'
