- field_path: core.commercial.termination_compensation
  section: commercial
  value_type: long_text
  required: false
  decision: approved
  final_value: On an RPD Event of Default, the RPD pays SECI the Article 4.6 penalty (encashment of PBG/Surety Bond pro-rata
    for capacity not commissioned; beyond 3 months after SCD the CfDA for balance capacity stands terminated) and the Article
    4.4.1 shortfall penalties; for other defaults the RPD pays damages equal to 6 months (or the balance CfDA period, if less)
    of the average gain shared by the RPD with the Pool during the 2 consecutive Contract Years that triggered the default,
    recoverable by forfeiture of the bank guarantee/Surety Bond/LC. Lenders may substitute the RPD, failing which SECI may
    terminate; CTU/STU charges on termination are borne by the RPD. The consequences of a SECI Event of Default (Article 13.4)
