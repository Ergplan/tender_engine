- field_path: sector.power.common.deemed_generation_clause
  section: commercial
  value_type: long_text
  required: false
  decision: approved
  final_value: Under Article 4.10, for grid unavailability beyond 175 hours in a Contract Year (for reasons not attributable
    to the RPD, with documentary evidence), Generation Compensation = Applicable Tariff x RE power (MW) offered but not scheduled
    by the Buying Entity x 1000 x hours of grid unavailability, payable by the Buying Entity(ies) annually with no claim against
    SECI. For reduced offtake by the Buying Entity (including non-dispatch under the LPS Rules 2022), the same formula applies
    using hours of reduced off-take, with the table likewise referencing beyond 175 hours in a Contract Year; the RPD must
    sell in the power exchange as price taker and 95% of the amount realized (after expenses) is adjusted monthly against
    the compensation; payment is made with the energy bill of the successive month without trading margin. No compensation
    for backdown due to grid security, equipment/personnel safety or Force Majeure.
