  value_type: long_text
  required: true
  decision: approved
  final_value: 'What is procured: SECI is procuring 1000 MW of Firm and Dispatchable Renewable Energy Round-the-Clock (FDRE-RTC)
    power from ISTS-connected renewable energy projects in India under tariff-based competitive bidding. [1][2][3][4][5] A
    bidder may offer between 50 MW and 500 MW, and each project must include an energy storage system, with the components
    of the project to be disclosed. [6][7][8][9][10][11]


    Buyer and offtaker: Solar Energy Corporation of India Limited issues the tender and buys the power as an intermediary
    procurer, selling it on at the PPA tariff plus its trading margin to Buying Entities (discoms), which must compulsorily
    off-take scheduled power during Peak and Remaining Hours. [12][13][14] The Buying Entities are not named; their details
    will be intimated later. [15] The Power Purchase Agreement runs for 25 years. [16]


    Location: Projects may be located anywhere in India at locations chosen by the bidder at its own discretion, risk, cost
    and responsibility, provided they connect to the ISTS. [17][18][19][20] The delivery point is the ISTS substation at 220
    kV or above where the project''s power is injected (an InSTS/STU substation only if both the developer and the Buying
    Entity agree), and metering is at that injection point. [21][22][23][24] The developer builds and pays for the transmission
    line from the project up to and including the interconnection point, bearing all related charges and losses. [25][26]


    Timeline: The RfS was issued on 10 March 2026, the pre-bid meeting was held on 19 March 2026, bids are due on 20 July
    2026 and technical bids open on 23 July 2026, with the e-Reverse Auction date to be intimated to eligible bidders by email.
    [27][28][29][30][31][32][33] Bids remain valid for 12 months. [34] Scheduled commissioning is 24 months from PPA signing,
    with financial closure due 6 months before the scheduled commissioning date. [35][36]


    Eligibility: A bidder quoting X MW must have commissioned in the last seven years, as owner or EPC contractor, either
    one project of at least 4X/5 MW, two of at least X/2 MW each or three of at least 2X/5 MW each; under-construction projects
    do not count. [37][38][39][40] Financial thresholds are a turnover of INR 40,000,000 (INR 4 crore) per MW, liquidity of
    INR 8,000,000 (INR 80 lakh) per MW and net worth of INR 9,540,000 (INR 95.4 lakh) per MW. [41][42][43][44] Consortia may
    bid and affiliate credentials may be used, but controlling shareholding may not change from bid submission until PPA execution,
    and promoters may not cede control, nor may the shareholding in an SPV fall below 51%, until 1 year after the scheduled
    commencement of supply date except with SECI''s prior approval. [45][46][47][48][49]


    Money at risk: The EMD is Rs. 9,54,000 x S + 13,32,000 x W + 2,35,450 x E, valid for 12 months, and the PBG is Rs. 23,85,000
    x S + 33,30,000 x W + 5,88,625 x E, submitted within 30 days of SECI''s invitation to sign the PPA, with delay charged
    at Rs. 1000/MW/day plus GST on the unsigned capacity. [50][51][52][53][54][55][56][57] Bidders also pay success charges
    of INR 100,000 (INR 1 lakh) per MW and a bid processing fee of INR 20,000. [58][59] SECI may encash the EMD if the selected
    bidder fails to submit the PBG, success charge or proof of connectivity in time or fails to sign the PPA, and the PBG
    is encashed pro-rata to capacity that has not commenced supply where supply is delayed beyond the scheduled or extended
    date up to the 6-month termination deadline. [60][61][62][63]


    Tariff or payment: The successful bidder is paid a fixed tariff under a 25-year PPA. [64][16] SECI backs payment with
    a monthly unconditional, revolving and irrevocable Letter of Credit sized at 110% of estimated average monthly billing,
    bills fall due 45 days after receipt, and late payment attracts a surcharge at SBI one-year MCLR plus 500 bps, rising
    by 50 bps per month up to 3 percent above the base rate. [65][66][67][68][69][70][71][72] Change in law events after 7
    days before the bid deadline are compensated through a monthly tariff adjustment under the Electricity (Timely Recovery
    of Costs due to Change in Law) Rules, 2021. [73][74][75][76]


    Obligations and penalties: The developer must schedule power day-ahead round the clock against the Contracted Capacity,
    meeting a minimum Demand Fulfilment Ratio of 90% in each 15-minute block of the 6 Peak Hours chosen daily by the Buying
    Entity, 50% to 60% in Solar Hours and 70% in Remaining Hours, using domestically manufactured ALMM List-I cells and modules.
    [77][78][79][80][81][82][83][84][85][86][87][88] Shortfalls against the minimum DFR are added up time-block-wise and recovered
    from the next monthly bill at 1.5 times the PPA tariff on the shortfall energy, and failing the minimum DFR for 2 consecutive
    Contract Years is an Event of Default that reduces the obligation to the average achieved and triggers lump-sum damages
    equal to 24 months or the balance PPA period, whichever is less. [89][90][91][92][93][94][95][96][97][98][99] Commencement
    of supply may be delayed up to 6 months beyond the scheduled date with penalty and pro-rata PBG encashment, after which
    the PPA may be terminated. [100][62][63]'
