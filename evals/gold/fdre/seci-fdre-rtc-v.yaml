- field_path: core.penalties.shortfall_penalty_basis
  section: penalties
  value_type: long_text
  required: false
  decision: approved
  final_value: 'Shortfall is measured against minimum Demand Fulfilment Ratio (DFR) requirements per 15-minute time-block:
    min. DFR 90% of Contracted Capacity in Peak Hours, min. 50% (max. 60%) in Solar Hours and min. 70% in Remaining Hours.
    DFR = power scheduled ÷ Contracted Capacity. Shortfalls in each time-block are added up, penalty calculated time-block-wise,
    reconciled monthly and recovered from the subsequent monthly bill (calculated separately for each Buying Entity if mapped
    to more than one). The revised Annexure-C/Schedule-4 illustration computes the penalty as 1.5 x PPA tariff x shortfall
    energy (e.g. 1.5 x 4.0 x 412.5 MWh). Failure to maintain min. DFR for 2 consecutive Contract Years (excluding first) is
    an Event of Default; DFR obligation is reduced to actual average achieved and RPD pays lump-sum damages equivalent to
    24 months (or balance PPA period, whichever less) for the aggregate energy shortfall.'
