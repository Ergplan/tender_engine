- field_path: core.commercial.change_in_law_clause
  section: commercial
  value_type: long_text
  required: false
  decision: approved
  final_value: Change in Law means events occurring after the date 7 days prior to the bid submission deadline, including
    enactment, amendment or repeal of any law leading to a change in cost requiring a tariff change, a change in interpretation
    of law by a competent court, a change in any domestic tax (duty, levy, cess, charge or surcharge) by Central/State/UT
    government, or a change in conditions of an approval or licence; it excludes changes in withholding tax on income/dividends,
    changes in deviation settlement charges or frequency intervals, and events after the SCSD/extended SCSD that would not
    have affected a timely commissioned project. On occurrence, the monthly tariff is adjusted and recovered under the Electricity
    (Timely Recovery of Costs due to Change in Law) Rules, 2021 to restore the affected party to the same economic position,
    with 21 days' prior notice, computation within 30 days, recovery from the next billing cycle via an annuity formula MT
    = Y/X (X = (1/12) x Contracted Capacity MW x 8760 x 10 kWh; interest rate per CERC or SBI MCLR + 200 bps), over a maximum
    of 180 months for non-recurring impacts or until the impact persists for recurring impacts, rounded to three decimals.
    The Appropriate Commission verifies and adjusts within 60 days; any decrease in project cost must be passed on to SECI
    and the Buying Entity, and relief is limited to Project Cost incurred up to commencement of supply or SCSD, in proportion
    to capacity commissioned.
  version_no: 1
