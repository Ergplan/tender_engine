- field_path: sector.power.fdre.availability_shortfall_penalty
  section: fdre_profile
  value_type: long_text
  required: true
  decision: approved
  final_value: Shortfall in meeting the minimum DFR in each time-block during Peak, Solar and Remaining Hours is added up
    time-block-wise, reconciled monthly and recovered from the subsequent monthly bill; where a project serves two or more
    Buying Entities the penalty is computed separately per Buying Entity. The revised Annexure-C / Schedule-4 illustration
    computes the monthly penalty as 1.5 x PPA tariff x shortfall energy (e.g. 1.5 x 4.0 x 412.5 MWh = INR 24.75 lakh). Failure
    to maintain minimum DFR in every time-block during Peak, Solar and Remaining Hours for 2 consecutive Contract Years (excluding
    the first) is an Event of Default; under Article 13.3.5 the DFR obligation is reduced to the average achieved and lump-sum
    damages equal to 24 months or balance PPA period are payable.
