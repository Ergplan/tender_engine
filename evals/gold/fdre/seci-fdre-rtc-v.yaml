- field_path: core.commercial.termination_compensation
  section: commercial
  value_type: long_text
  required: false
  decision: approved
  final_value: 'Amended PPA Article 13.3.5 (and PSA Article 3.2.7): where the RPD fails the minimum DFR for 2 consecutive
    Contract Years, its minimum Peak, Solar and Remaining Hours DFR obligation is reduced to the average actually achieved
    in the 2 default years and the RPD pays the Buying Entity(ies) lump-sum damages equivalent to 24 (twenty-four) months
    or the balance PPA period, whichever is less, for the aggregate energy shortfall arising from the reduction in the DFR
    obligation. On termination of the PPA in such cases and in other RPD default cases (except failure to commence supply
    in time), the RPD pays damages equivalent to 24 (twenty-four) months or the balance PPA period, whichever is less, for
    the aggregate energy corresponding to the minimum Peak, Solar and Remaining Hours DFR obligation. Compensation for Buying
    Entity/SECI default is not addressed in this amendment.'
