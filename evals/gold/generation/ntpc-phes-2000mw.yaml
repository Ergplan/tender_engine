- field_path: core.summary.plain_english_summary
  section: summary
  value_type: long_text
  required: true
  decision: approved
  final_value: 'What is procured: NTPC Renewable Energy Limited is selecting developers for ISTS-connected pumped hydro energy
    storage solutions totalling 2000 MW / 12000 MWh, procured under a PHES-as-a-Service model through an e-reverse auction.
    [1][2][3][4][5][6][7][8] A bid must offer at least 500 MW at a single location and may go up to 2000 MW. [1][9][10]


    Buyer and offtaker: The tender is issued by NTPC Renewable Energy Limited, which published the notice as an abridged IFB
    on its tender page. [11][12] NTPC Renewable Energy Limited (NTPC REL) is also the offtaker: it avails the storage capacity
    as a service under an Energy Storage Service Agreement to meet its own RE RTC commitments. [13][14][15][16]


    Location: Projects may be located anywhere in India provided they are connected to the ISTS, with a minimum of 500 MW
    at a single location. [17][10][8] The delivery and metering point is the interconnecting point with the ISTS substation.
    [18][19]


    Timeline: The tender was issued on 29 May 2026; bids are due by 21 July 2026 at 15:00 and technical bids open the same
    day at 15:30, although the portal notice also lists a separate closing date of 6 July 2026 whose purpose is unclear, and
    pre-bid, query and e-reverse auction dates are not given. [20][21][22][23] The agreement is to be signed within 90 days,
    and the project must be commissioned within 48 months counted from the effective date. [16][24][25][26] The agreement
    runs for 25 years. [27][28]


    Eligibility: The record does not state who may bid or any technical or financial qualification thresholds. It does state
    that for under-construction or not-yet-commissioned projects the bidder must already have obtained the required clearances,
    with the DPR approved by the designated government authorities. [29]


    Money at risk: The record does not state the earnest money deposit, bid security, performance guarantee or the conditions
    for their forfeiture.


    Tariff or payment: The successful bidder is paid a capacity charge on an annual fixed charge basis under an Energy Storage
    Service Agreement of 25 years, and the tariff is not two-part. [27][28][30][31][15][16] Charging power is supplied by
    NTPC REL from the RE projects of NTPC/NTPC REL, and the storage facility is used on an on-demand basis. [32][33]


    Obligations and penalties: The developer is responsible for connectivity and transmission up to the ISTS substation. [18][34][19]
    The bidder must obtain the required clearances and have the DPR approved by the designated government authorities; water
    is not specifically addressed. [29][35] The record does not state the penalties for a shortfall in availability or a delay
    in commissioning.'
