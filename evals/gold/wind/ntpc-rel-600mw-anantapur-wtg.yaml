- field_path: core.summary.plain_english_summary
  section: summary
  value_type: long_text
  required: true
  decision: approved
  final_value: 'What is procured: NTPC REL is buying the supply and installation of wind turbine generators for an ISTS-connected
    wind energy project with a nominal capacity of 600 MW, made up of 200 WTGs, under domestic competitive bidding. [1][2][3][4]
    The turbines must be ALMM (Wind) listed and of any rating of 3.0 MW or above, with no hub height restriction stated. [5][6][7][8]
    The scope also includes ten years of comprehensive operation and maintenance of the WTGs and unit substations from commissioning
    of the project. [9]


    Buyer and offtaker: The tender is issued by NTPC Renewable Energy Limited (NTPC REL), a subsidiary of NTPC Limited, which
    invites bids on a single-stage two-envelope basis through the ISN Electronic Tender Services portal. [10][11][12][13]
    NTPC REL is the Employer and owner procuring the WTG supply, installation and O&M services. [14][15] The Employer intends
    to finance the package from its own resources or borrowings. [15]


    Location: The project is at a named site in Anantapur, Andhra Pradesh, and is to be connected to the inter-state transmission
    system (ISTS). [4][1] The WTGs are to be placed at 200 locations for a minimum of 600 MW; the land is made available by
    NTPC REL, and land, the power evacuation system, pooling substation, internal roads, grid substation connectivity and
    SCADA backbone network are outside the WTG package scope. [16][17][18]


    Timeline: The tender was issued on 19 August 2026, the pre-bid meeting and the last date for queries are both on 1 September
    2026, and bids are due and technical bids opened on 15 September 2026. [19][20][21][22][23] Bid validity, the award timeline
    and the commissioning schedule are not printed in the IFB, which refers to bidding document No. NRE-CS-5924-003(WTG)-9
    on the ETS portal for detailed terms. [24]


    Eligibility: The bidder must be a manufacturer of an approved WTG model of minimum rating 3000 kW in the latest ALMM (Wind)
    List issued by MNRE prior to the techno-commercial bid opening, or an Indian company that is a subsidiary, holding or
    group company of such a firm and furnishes a joint undertaking with it for joint and several performance of the contract.
    [25][26][27][5][7] No project commissioning or track-record experience is specified. [25][26] The turnover requirement
    is INR 10,240,000 (INR 1.024 crore) per MW. [28][29]


    Money at risk: A Bid Security of INR 50,00,00,000 (fifty crore) must accompany all bids, submitted in a separate sealed
    envelope, with proof of e-payment if paid through EFT. [30][31][32][33][34] The record does not state a performance guarantee
    or the conditions under which the bid security is forfeited.


    Tariff or payment: The record does not state how the successful bidder is paid or the term of the supply and installation
    contract.


    Obligations and penalties: The contractor must supply and install ALMM (Wind) listed WTGs, offer a UL-certified Annual
    Energy Production based on the site-specific wind data NTPC REL makes available, and provide inputs for statutory approvals
    and clearances for power evacuation and grid connectivity. [35][5][6][36][37] The contractor also carries ten years of
    comprehensive operation and maintenance of the WTGs and unit substations from commissioning. [9] The record does not state
    the penalties for a shortfall or delay.'
