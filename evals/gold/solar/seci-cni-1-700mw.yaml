- field_path: core.summary.plain_english_summary
  section: summary
  value_type: long_text
  required: true
  decision: approved
  final_value: 'What is procured: SECI is procuring 700 MW of ISTS-connected solar PV power projects in India, to be set up
    by developers in Special Economic Zones or Export Oriented Units on a Build Own Operate basis, under tariff-based competitive
    bidding. [1][2][3][4] Each bidder may offer between 50 MW and 700 MW, and selection is by e-reverse auction on the ETS
    Portal. [2][5][6][7][8]


    Buyer and offtaker: SECI issues the tender and signs the Power Purchase Agreement as Intermediary Procurer, selling the
    power on a back-to-back basis under a Power Sale Agreement to a Buying Entity. [9][10][11][12][13][14] The Buying Entity
    is an End Procurer or C&I Consumer, an EOU unit located in the State of Odisha, whose details will be intimated later.
    [11][12][13][15][16]


    Location: Projects may be located anywhere in India with ISTS connectivity, but must be set up in Special Economic Zones
    or areas designated as Export Oriented Units, with land identification in the developer''s scope. [17][18][19][20][21][22]
    The delivery point is a single or multiple points at 220 kV or above where power is injected into the identified ISTS
    substation, by default the ISTS substation itself, and metering is at that interconnection point. [23][24][25]


    Timeline: The tender was issued on 3 September 2026, with a pre-bid meeting on 14 September 2026, bid submission due by
    15 October 2026 and technical bid opening on 21 October 2026. [26][27][28][29] Bids remain valid for 12 months. [30][31]
    Scheduled commissioning is 24 months from the effective date, and financial closure must be achieved 6 months before the
    scheduled commissioning date. [32][33]


    Eligibility: There is no prior project experience or commissioned-capacity requirement; bidders need only deploy commercially
    established technologies and meet the stated technical parameters, and the project is exempt from ALMM given its Green
    Hydrogen/Ammonia end use. [34][35][36] Financially, bidders must show a net worth of INR 80 lakh per MW, an annual turnover
    of INR 37.26 lakh per MW and liquidity of INR 7.451 lakh per MW. [37][38][39][40][41] Consortia may bid and parent or
    affiliate credentials may be used, subject to a lock-in under which controlling shareholding may not change from bid submission
    to PPA execution and promoters may not cede control until one year after the scheduled commencement of supply without
    SECI approval. [42][43][44][45]


    Money at risk: Bidders must furnish an earnest money deposit of INR 8 lakh per MW valid for 12 months, along with a bid
    processing fee of INR 20 lakh, and successful bidders pay success charges of INR 1 lakh per MW. [46][47][48][49][50] A
    performance bank guarantee of INR 20 lakh per MW per project must be submitted in one lot within 30 days of SECI''s invitation
    to sign the PPA, valid until 12 months after the scheduled commencement of supply, and the EMD of successful bidders is
    returned once the PBG is verified. [51][52][53][54][55][56][57][58] The PBG is encashed pro-rata for capacity not commenced
    within 3 months after the scheduled date, in full if financial closure documents are not submitted 6 months before the
    scheduled date, and to recover damages on an SPD Event of Default; otherwise it is returned within 45 days of commencement
    of supply from the full capacity, net of any delay penalties. [55][56][57][58][59][60][61][62][63]


    Tariff or payment: The successful bidder is paid a fixed tariff under a 25-year Power Purchase Agreement with SECI. [64][65]
    Payment is secured by a monthly revolving irrevocable Letter of Credit from SECI set at 110% of estimated average monthly
    billing, on which the developer may draw once a month if an undisputed bill is unpaid by the due date. [66][67][68][69][70]
    Late payments attract a surcharge at SBI one-year MCLR plus 5 percent for the first month, rising by 0.5 percent for each
    further month up to 3 percent above the base rate, payable subject to SECI receiving it from the Buying Entity. [71][72][73]


    Obligations and penalties: The developer must maintain a minimum CUF of 25 percent and, in any contract year after the
    first, supply at least 85 percent of the declared CUF energy or pay a penalty of 1.5 times the applicable tariff on the
    shortfall; failure for 2 consecutive years is an event of default carrying lump-sum damages of 24 months of tariff on
    the reduced capacity, failing which the PPA is terminated. [74][75][76][77][78] Delay in commencing supply may be extended
    with penalty for up to 3 months beyond the scheduled date, recovered by encashing the PBG pro-rata to the capacity not
    commenced, and delay beyond 3 months leads to termination. [79][59][60][61][62][63][80][81] The developer is also responsible
    for obtaining connectivity or GNA at the ISTS network with a start date on or before 31 December 2028, for building and
    funding the transmission line up to the ISTS substation, and for all land and clearances including SEZ/EOU consents. [82][83][84][85][86][87][88][89][90][91]'
