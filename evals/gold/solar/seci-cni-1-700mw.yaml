- field_path: core.commercial.termination_compensation
  section: commercial
  value_type: long_text
  required: false
  decision: approved
  final_value: On SECI Event of Default, if SECI does not novate the PPA to an acceptable third party within the stipulated
    period, the SPD may terminate and at its discretion require SECI/Buying Entity either (i) to take over the Project assets
    paying termination compensation equal to the debt due plus 150% of the adjusted equity, or (ii) to pay damages equal to
    6 months (or the balance PPA period if less) of charges for the Contracted Capacity, with the SPD retaining the assets;
    STU/CTU connectivity damages are borne by SECI/Buying Entity. If the SECI-Buying Entity PSA is terminated, any termination
    compensation paid by the Buying Entity is passed to the SPD after deducting SECI's costs; termination for prolonged Force
    Majeure is at SECI's discretion with no liability to SECI/Buying Entity. The consequences of an SPD Event of Default (document
    pages 59-61) are not among the attached pages.
