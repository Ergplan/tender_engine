- field_path: core.commercial.change_in_law_clause
  section: commercial
  value_type: long_text
  required: false
  decision: approved
  final_value: 'Change in Law (Article 12) covers events pertaining to the Project occurring after the date 7 days prior to
    the bid submission deadline: enactment, amendment or repeal of any law leading to cost changes requiring a tariff change,
    change in interpretation of law by a competent court, change in any domestic tax (duty, levy, cess, charge or surcharge)
    by Central/State/UT government, and change in any condition of approval or licence for purchase, supply or transmission
    of electricity. It excludes changes in withholding tax on income/dividends, changes in deviation settlement charges or
    frequency intervals, and events after the SCSD/extended SCSD that would not have affected a timely-commissioned Project.
    Compensation is by adjustment of the monthly tariff under the Electricity (Timely Recovery of Costs due to Change in Law)
    Rules, 2021 to restore the affected party to the same economic position; the affected party gives 21 days'' notice, recovery
    starts from the next billing cycle, non-recurring impacts are annuitised (MT = Y/X) over up to 180 months at the CERC
    loan interest rate, trued up annually, and the SPD must pass on any cost decrease to SECI for onward transfer to the Buying
    Entity.'
  version_no: 1
  evidence_pages:
