- field_path: core.penalties.shortfall_penalty_basis
  section: penalties
  value_type: long_text
  required: false
  decision: approved
  final_value: If in any Contract Year (excluding the first Contract Year ending 31 March after commencement) the SPD fails
    to supply minimum energy corresponding to 85% of the declared/modified CUF, save for Force Majeure, it pays a penalty
    equal to 1.5 times the Applicable Tariff for the shortfall in energy terms, remitted to the Buying Entity; the lower limit
    is relaxable for grid non-availability compensation under Article 4.10.1. Failure to supply the minimum CUF energy for
    2 consecutive Contract Years is an SPD Event of Default; the minimum CUF obligation is then reduced to the average actual
    CUF of the 2 default years and the SPD pays lump-sum damages equal to 24 months (or balance PPA period, if less) of tariff
    for the reduction, failing which the PPA is terminated.
