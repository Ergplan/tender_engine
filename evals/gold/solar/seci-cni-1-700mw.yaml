- field_path: core.commercial.late_payment_surcharge
  section: commercial
  value_type: text
  required: false
  decision: approved
  final_value: On delay in payment of a Monthly Bill beyond the Due Date, SECI pays a Late Payment Surcharge on the outstanding
    amount at the base rate (SBI one-year MCLR as on 1 April of the financial year plus five percent / 500 bps) for the first
    month of default; the rate increases by 0.5 percent (50 bps) for every further month of delay, capped at 3 percent above
    the base rate. The surcharge is claimed through a Supplementary Bill and is paid by SECI subject to its receipt of such
    surcharge from the Buying Entity under the PSA.
