- field_path: core.commercial.payment_security_mechanism
  section: commercial
  value_type: long_text
  required: false
  decision: approved
  final_value: SECI provides the SPD a monthly unconditional, revolving and irrevocable Letter of Credit through a scheduled
    bank, operative before the Due Date of the first Monthly Bill, with a 12-month term renewed annually. The LC amount is
    110% of the estimated average monthly billing for the first Contract Year and 110% of the average monthly billing of the
    previous Contract Year thereafter; SECI bears all LC costs and must restore any shortfall before the next drawal. The
    SPD may draw on the LC (one drawal per month) if SECI fails to pay an undisputed bill by the Due Date; the Electricity
