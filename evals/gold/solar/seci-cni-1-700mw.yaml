- field_path: sector.power.common.deemed_generation_clause
  section: commercial
  value_type: long_text
  required: false
  decision: approved
  final_value: 'Article 4.10: in case of Backdown (capacity available but not scheduled on instructions of Buying Entity/SLDC/RLDC),
    subject to documentary evidence from the competent authority, the SPD is eligible for a minimum Generation Compensation
    from the Buying Entity for hours of Backdown beyond 175 hours in a Contract Year, computed as Applicable Tariff x Solar
    PV Power (MW) offered but not scheduled x 1000 x number of hours of Backdown, with no claim against SECI. Payment is made
    as part of the energy bill for the month after receipt of Energy Accounts, with no trading margin; no compensation is
    payable where Backdown is for grid security, equipment/personnel safety or Force Majeure. Article 4.4.1 also relaxes the
    minimum CUF for generation compensation due to grid non-availability, and Article 9.4 lets the SPD sell unrequisitioned
    power to third parties or power exchange without NOC.'
