    critical: false
  # ntpc-hybrid-03 (hybrid)
  - id: q37
    tender: ntpc-hybrid-03
    question: What is the bid due date?
    field_path: core.key_dates.bid_submission_deadline
    expect: {kind: date, value: 2024-12-02}
    critical: true
  - id: q38
    tender: ntpc-hybrid-03
    question: How long is the bid validity, in days?
    field_path: core.key_dates.bid_validity
    expect: {kind: number, value: 180}
