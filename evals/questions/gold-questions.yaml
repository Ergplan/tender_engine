  - id: q39
    tender: ntpc-hybrid-03
    question: What happens if the project supplies less energy than the minimum CUF?
    field_path: core.penalties.shortfall_penalty_basis
    expect: {kind: text, any_of: ["cuf", "90%", "90 %"]}
