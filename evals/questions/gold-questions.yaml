# Cross-tender questions (Block 5 c): structured search over approved facts. `query` is
# the structured form the question should be read into; `expect` the gold tenders whose
# approved fact satisfies it (a tender with no decision on the field is `unreviewed`,
# never matched, so it is not listed).
cross_questions:
  - id: x01
    question: Which tenders have a total capacity of at least 1500 MW?
    query: {field_path: sector.power.common.total_capacity_mw, operator: ">=", value: 1500}
    expect: [seci-fdre-ix, ntpc-phes-2000mw, wbsedcl-re-rtc-2026-01]
  - id: x02
    question: Which tenders allow consortium bidders?
    query: {field_path: core.eligibility.consortium_allowed, operator: "==", value: true}
    expect: [seci-ess-iv, seci-gaya-60mw, nhpc-fdre-ii, seci-cfd-i, seci-fdre-ix, seci-fdre-rtc-v, ntpc-hybrid-03, seci-cni-1-700mw]
  - id: x03
    question: Which tenders have a PPA tenure of 25 years?
    query: {field_path: sector.power.common.ppa_tenure_years, operator: "==", value: 25}
    expect: [nhpc-fdre-ii, seci-fdre-ix, seci-fdre-rtc-v, ntpc-phes-2000mw, ntpc-hybrid-03, wbsedcl-re-rtc-2026-01, seci-cni-1-700mw]
