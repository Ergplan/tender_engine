  - id: q43
    tender: wbsedcl-re-rtc-2026-01
    question: What minimum annual CUF must the supplier deliver?
    field_path: core.penalties.shortfall_penalty_basis
    expect: {kind: text, any_of: ["80%", "80 %", "80 percent"]}
