# Block 5 d: fifty questions over the eleven gold tenders. Every expected answer is the
# reviewer's decided value from the gold record (evals/gold/<type>/<slug>.yaml, "reviewer"
# there), not a value written for this file: the gold record is the reviewer-written
# answer. `field_path` names the gold field; `expect` says how the answer is checked
# (evals/ask_eval.py): a date in any written form, a number in any Indian or plain form
# (lakh, crore, commas), a phrase for text, yes/no for a boolean. `critical` follows Block
# 1's cut (dates, capacity, tariff, EMD, PBG, eligibility thresholds, penalties).
# Questions are phrased both the way the record names a field and the way a person asks,
# so the field route and the retrieval route are both measured.
questions:
  # seci-ess-iv (bess)
  - id: q01
    tender: seci-ess-iv
    question: What is the bid submission deadline?
    field_path: core.key_dates.bid_submission_deadline
    expect: {kind: date, value: 2026-10-30}
    critical: true
  - id: q02
    tender: seci-ess-iv
    question: How large is the storage capacity being procured, in MW?
    field_path: sector.power.common.total_capacity_mw
    expect: {kind: number, value: 800}
    critical: true
  - id: q03
    tender: seci-ess-iv
    question: What is the smallest bid a bidder may offer, in MW?
    field_path: sector.power.common.min_bid_mw
    expect: {kind: number, value: 50}
    critical: true
  - id: q04
    tender: seci-ess-iv
    question: For how many years does the agreement with the BESSD run?
    field_path: sector.power.common.ppa_tenure_years
    expect: {kind: number, value: 20}
    critical: false
  - id: q05
    tender: seci-ess-iv
    question: What is the tender processing fee?
    field_path: core.guarantees.processing_fee_inr
    expect: {kind: number, value: 20000}
    critical: false
  - id: q06
    tender: seci-ess-iv
    question: What minimum monthly system availability must the BESSD guarantee?
    field_path: core.penalties.shortfall_penalty_basis
    expect: {kind: text, any_of: ["85%", "85 %", "85 percent"]}
    critical: true
  # seci-gaya-60mw (epc)
  - id: q07
    tender: seci-gaya-60mw
    question: When is the pre-bid meeting?
    field_path: core.key_dates.pre_bid_meeting_date
    expect: {kind: date, value: 2026-10-16}
    critical: true
  - id: q08
    tender: seci-gaya-60mw
    question: What is the plant capacity in MW?
    field_path: sector.power.common.total_capacity_mw
    expect: {kind: number, value: 60}
    critical: true
  - id: q09
    tender: seci-gaya-60mw
    question: What minimum annual turnover must a bidder show to qualify?
    field_path: core.eligibility.turnover_requirement_inr
    expect: {kind: number, value: 965400000}
    critical: true
  - id: q10
    tender: seci-gaya-60mw
    question: Is a consortium allowed to bid?
    field_path: core.eligibility.consortium_allowed
    expect: {kind: bool, value: true}
    critical: true
  - id: q11
    tender: seci-gaya-60mw
    question: Who is the employer under the EPC contract?
    field_path: core.commercial.offtaker
    expect: {kind: text, any_of: ["seci", "solar energy corporation"]}
    critical: false
  # nhpc-fdre-ii (fdre)
  - id: q12
    tender: nhpc-fdre-ii
    question: What is the last date for submission of bids?
    field_path: core.key_dates.bid_submission_deadline
    expect: {kind: date, value: 2024-04-12}
    critical: true
  - id: q13
    tender: nhpc-fdre-ii
    question: What is the maximum capacity a single bidder can bid for?
    field_path: sector.power.common.max_bid_mw
    expect: {kind: number, value: 600}
    critical: true
  - id: q14
    tender: nhpc-fdre-ii
    question: For how many days must the bid remain valid?
    field_path: core.key_dates.bid_validity
    expect: {kind: number, value: 180}
    critical: true
  - id: q15
    tender: nhpc-fdre-ii
    question: What is the bid processing fee?
    field_path: core.guarantees.processing_fee_inr
    expect: {kind: number, value: 300000}
    critical: false
  - id: q16
    tender: nhpc-fdre-ii
    question: What is the term of the power purchase agreement in years?
    field_path: sector.power.common.ppa_tenure_years
