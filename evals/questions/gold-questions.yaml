  - id: q17
    tender: nhpc-fdre-ii
    question: What is the overall cap on the earnest money deposit per project?
    field_path: core.guarantees.emd_structured
    expect: {kind: number, value: 100000000}
    critical: true
  # seci-cfd-i (fdre)
  - id: q18
    tender: seci-cfd-i
    question: What is the tariff ceiling in INR per kWh?
    field_path: sector.power.common.tariff_ceiling_inr_per_kwh
