# The parser benchmark's hard set (Stage 7, Block 2 b): pages pdfplumber finds no text
# layer on, with quotes transcribed by hand from the page renders. A layer "locates" a
# quote when core.evidence.resolver.resolve finds it on the page text the layer produced.
# Documents are named by filename and matched by sha256 prefix in the database.
