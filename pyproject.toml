[project]
name = "tender-engine"
version = "0.1.0"
description = "Tender Intelligence Engine: evidence-first extraction with human approval"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "sqlalchemy>=2.0.36,<3",
    "alembic>=1.14,<2",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "psycopg[binary]>=3.2,<4",
    "anthropic>=1,<2",
    "python-multipart>=0.0.18",
    "pdfplumber>=0.11,<1",
    "pymupdf>=1.25,<2",
    "rapidfuzz>=3.10,<4",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "pytest-timeout>=2.3,<3",
    "httpx>=0.28,<1",
    "ruff>=0.9",
    "mypy>=1.14",
    "watchfiles>=1.0,<2",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["web", "migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["core", "tender", "api", "worker", "evals"]

[tool.pytest.ini_options]
testpaths = ["tests", "tender/domain_packs"]
timeout = 120
addopts = "-q -m 'not slow'"
markers = ["slow: calls the real LLM; run with make test-e2e, never in the watcher"]
