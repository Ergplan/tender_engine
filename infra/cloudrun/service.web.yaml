# Cloud Run service: the front end as a static bundle behind nginx (Dockerfile.web.prod).
# The load balancer sends /api/* and /files/* to tender-api; API_UPSTREAM is the fallback
# for a single-service test.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: tender-web
  annotations:
    run.googleapis.com/ingress: internal-and-cloud-load-balancing
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "4"
    spec:
      containerConcurrency: 200
      serviceAccountName: tender-run@[PROJECT].iam.gserviceaccount.com
      containers:
        - image: "[IMAGE_WEB]"
          ports:
            - containerPort: 8080
          resources:
            limits:
              cpu: "1"
              memory: 256Mi
          env:
            - name: API_UPSTREAM
              value: "https://tender-api-[HASH]-[REGION_CODE].a.run.app"
