# Cloud Run service: the API of the enterprise product. Rendered by deploy.sh
# ([PROJECT], [REGION], [IMAGE_PYTHON], [SQL_CONNECTION], [BUCKET] replaced).
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: tender-api
  annotations:
    run.googleapis.com/ingress: internal-and-cloud-load-balancing
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "1"
        autoscaling.knative.dev/maxScale: "4"
        run.googleapis.com/cloudsql-instances: "[SQL_CONNECTION]"
        run.googleapis.com/cpu-throttling: "true"
    spec:
      containerConcurrency: 40
      timeoutSeconds: 300
      serviceAccountName: tender-run@[PROJECT].iam.gserviceaccount.com
      containers:
        - image: "[IMAGE_PYTHON]"
          args: ["uvicorn", "api.main:create_app", "--factory", "--host", "0.0.0.0", "--port", "8080"]
          ports:
            - containerPort: 8080
          resources:
            limits:
              cpu: "1"
              memory: 1Gi
          env:
            - name: PRODUCT
              value: enterprise
            - name: STORAGE_BACKEND
              value: gcs
            - name: GCS_BUCKET
              value: "[BUCKET]"
            - name: TENANT_ID
              value: ergplan
            - name: PUBLIC_BASE_URL
              value: "https://[YOUR DOMAIN]"
            - name: ANTHROPIC_API_KEY
              valueFrom: {secretKeyRef: {name: ANTHROPIC_API_KEY, key: latest}}
            - name: OPENAI_API_KEY
              valueFrom: {secretKeyRef: {name: OPENAI_API_KEY, key: latest}}
            - name: DATABASE_URL
              valueFrom: {secretKeyRef: {name: DATABASE_URL, key: latest}}
            - name: ADMIN_TOKEN
              valueFrom: {secretKeyRef: {name: ADMIN_TOKEN, key: latest}}
            - name: SESSION_SECRET
              valueFrom: {secretKeyRef: {name: SESSION_SECRET, key: latest}}
            - name: OIDC_CLIENT_ID
              valueFrom: {secretKeyRef: {name: OIDC_CLIENT_ID, key: latest}}
            - name: OIDC_CLIENT_SECRET
              valueFrom: {secretKeyRef: {name: OIDC_CLIENT_SECRET, key: latest}}
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 5
            failureThreshold: 24
