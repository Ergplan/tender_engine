# Cloud Build: the production Python image (api, worker, agent, migrate).
#   gcloud builds submit . --substitutions _IMAGE=<image> --config infra/cloudrun/cloudbuild.python.yaml
steps:
  - name: gcr.io/cloud-builders/docker
    args: ["build", "-f", "infra/docker/Dockerfile.python", "--target", "prod", "-t", "${_IMAGE}", "."]
images: ["${_IMAGE}"]
substitutions:
  _IMAGE: asia-south2-docker.pkg.dev/tender-intelligence-510607/tender-engine/python:latest
